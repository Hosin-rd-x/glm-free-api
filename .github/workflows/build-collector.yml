name: build-token-collector
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build collector
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o token-collector ./cmd/token-collector
      - uses: actions/upload-artifact@v4
        with:
          name: token-collector
          path: token-collector
